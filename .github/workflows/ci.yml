# CI: build the site on every pull request, the same way
# deploy-gh-pages.yml builds it for GitHub Pages, without deploying.
# "CI OK" is the required check on main (unbound-force/.github's
# safe-settings/repos/website.yml), so nothing merges, by hand or by gh-hud's
# auto-merge, until it passes. Chore PRs (Dewey learnings, gh-hud toolkit
# rollouts) skip the build: see the scope job.
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # code == 'false' only for a pull request whose changed files are all:
  #   - regular .md files under learnings_dir (Dewey learnings), from anyone; or
  #   - under toolkit_paths, in a PR toolkit_author opened from a
  #     chore/toolkit-* branch (gh-hud toolkit rollouts; the branch pattern is
  #     fixed in pr-scope.yml).
  # Everything else, and every push, is code == 'true'. The inputs below are
  # pr-scope.yml's defaults, spelled out so the skip policy reads here.
  # Break glass: if jflowers/ship is unreachable, scope fails, Build still
  # runs, and CI OK fails; an org admin can merge past the ruleset, or point
  # this pin at a fork of the same commit.
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # v0.12.0
    with:
      learnings_dir: .uf/dewey/learnings/
      toolkit_paths: .opencode/
      toolkit_author: jflowers
    permissions:
      contents: read

  build:
    name: Build
    needs: scope
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3
        with:
          hugo-version: '0.155.1'
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: hugo --minify --gc --baseURL "https://unboundforce.dev/"

  # Required check. Passes only when scope succeeded and Build ran and
  # passed (code PRs) or was skipped (chore PRs): a required check that is
  # skipped counts as passing, so this job must fail whenever scope did.
  #
  #   scope     code   Build      CI OK   seen on
  #   success   true   success    pass    #467 (a code PR)
  #   success   true   failure    FAIL
  #   success   false  skipped    pass    a learnings-only PR (#469)
  #   success   false  success    FAIL    (Build's if: never allows this)
  #   failure   -      success    FAIL    Build runs: its if: is fail-closed
  #   cancelled -      any        FAIL
  #   success   other  any        FAIL    unknown code value
  ci-ok:
    name: CI OK
    needs: [scope, build]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check needed jobs
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "scope=$SCOPE code=$CODE build=$BUILD"
          [ "$SCOPE" = success ] || { echo "::error::scope: $SCOPE"; exit 1; }
          case "$CODE" in
            true) want=success ;;
            false) want=skipped ;;
            *) echo "::error::scope code '$CODE'"; exit 1 ;;
          esac
          [ "$BUILD" = "$want" ] || { echo "::error::Build: $BUILD, want $want"; exit 1; }
          echo "CI passed."
